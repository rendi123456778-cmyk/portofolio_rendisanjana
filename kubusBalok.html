<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Bangun Ruang - Rendi Sanjana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="img/profil.jpg" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="img/favicon-32x32.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-[#E8DCC4] text-[#123F36] min-h-screen flex flex-col justify-between items-center px-6 pt-10"
  >
    <main class="w-full flex flex-col items-center flex-grow justify-center">
      <div class="max-w-md w-full">
        <header class="mb-8 text-center">
          <a
            href="proyek.html"
            class="inline-block mb-6 text-sm text-[#123F36]/70 hover:text-[#123F36] transition float-left"
            >&larr; Kembali</a
          >
          <div class="clear-both"></div>
          <h1 class="text-2xl font-bold mb-2">Kalkulator Kubus & Balok</h1>
        </header>

        <section
          class="bg-white border border-[#C49A45]/30 rounded-lg p-6 flex flex-col gap-4 shadow-sm w-full"
        >
          <!-- pilihan bangun ruang -->
          <div>
            <label class="text-sm font-semibold block mb-1"
              >Pilih Bangun Ruang</label
            >
            <select
              id="shape"
              class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
            >
              <option value="kubus">Kubus</option>
              <option value="balok">Balok</option>
            </select>
          </div>

          <!-- form kubus -->
          <div id="formKubus" class="flex flex-col gap-4">
            <div>
              <label class="text-sm font-semibold block mb-1">Sisi</label>
              <input
                id="sisi"
                type="number"
                placeholder="cm"
                class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
              />
            </div>
          </div>

          <!-- form balok-->
          <div id="formBalok" class="flex flex-col gap-4 hidden">
            <div>
              <label class="text-sm font-semibold block mb-1">Panjang</label>
              <input
                id="panjang"
                type="number"
                placeholder="cm"
                class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
              />
            </div>
            <div>
              <label class="text-sm font-semibold block mb-1">Lebar</label>
              <input
                id="lebar"
                type="number"
                placeholder="cm"
                class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
              />
            </div>
            <div>
              <label class="text-sm font-semibold block mb-1">Tinggi</label>
              <input
                id="tinggi"
                type="number"
                placeholder="cm"
                class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
              />
            </div>
          </div>

          <!-- tombol aksi -->
          <button
            id="btnHitung"
            class="bg-[#2A6B5C] text-white rounded-md py-2 hover:bg-[#123F36] transition mt-2"
          >
            Hitung
          </button>

          <!-- hasil perhitungan -->
          <div class="mt-2 border-t border-gray-200 pt-4 text-center">
            <p class="text-sm text-gray-500">
              Volume:
              <span id="hasilVolume" class="font-semibold text-[#123F36]"
                >-</span
              >
            </p>
            <p class="text-sm text-gray-500 mt-1">
              Luas Permukaan:
              <span id="hasilLuas" class="font-semibold text-[#123F36]">-</span>
            </p>
          </div>
          <p id="pesanError" class="text-center text-red-500 text-sm hidden">
            isi semua kolom dengan angka lebih dari 0 dulu ya.
          </p>
        </section>
      </div>
    </main>

    <!-- footer -->
    <footer
      class="w-full text-center py-6 mt-10 text-sm text-gray-500 border-t border-[#C49A45]/30"
    >
      <p>&copy; 2026 Rendi Sanjana. Dibuat dengan HTML &amp; Tailwind CSS.</p>
    </footer>
    <!-- panggil jquery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="kubusBalok.js"></script>
  </body>
</html>
